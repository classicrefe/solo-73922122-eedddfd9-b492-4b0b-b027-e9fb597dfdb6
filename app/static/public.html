<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公开数据发布</title>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f6f8;color:#222}
  header{background:#2e6b4f;color:#fff;padding:14px 24px}
  header h1{margin:0;font-size:20px}
  main{max-width:960px;margin:20px auto;padding:0 16px}
  section{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  h2{font-size:16px;margin:0 0 12px}
  h3{font-size:14px;margin:14px 0 6px}
  table{border-collapse:collapse;margin-top:8px}
  th,td{border:1px solid #dde3ea;padding:6px 12px;font-size:14px;text-align:center}
  th{background:#eef2f6}
  .hint{font-size:13px;color:#667}
  button{background:#2e6b4f;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer;margin:4px 8px 4px 0}
  button.secondary{background:#5a6b7b}
  button.link{background:none;color:#2e6b4f;text-decoration:underline;padding:2px 4px}
  label{display:inline-block;margin:4px 12px 4px 0;font-size:14px}
  .range{border:1px solid #dde3ea;border-radius:6px;padding:10px 12px;margin:10px 0}
  .range .checks{margin:4px 0}
  .msg{margin-top:12px;padding:10px 12px;border-radius:6px;font-size:14px;white-space:pre-wrap;display:none}
  .msg.ok{display:block;background:#e6f6e8;border:1px solid #9ed3a7}
  .msg.err{display:block;background:#fdecea;border:1px solid #f2b8b0}
  .hidden{display:none}
  .pubpick{margin-top:6px}
  .cov{font-size:12px;color:#667}
  .bad{color:#b3261e}
  a{color:#1d5c8f}
</style>
</head>
<body>
<header><h1>公开数据发布</h1></header>
<main>
  <section>
    <h2>调查人数（分区 × 年龄组）</h2>
    <div id="grid">加载中…</div>
  </section>
  <section>
    <h2>已获准公开的汇总</h2>
    <p class="hint">本页仅提供人数与获准汇总，不提供各格检出数。</p>
    <div id="pubs"></div>
  </section>
  <section id="citeSec">
    <h2>写报告：拼出所需口径的引用算式</h2>
    <p class="hint">
      在下方勾选 1~20 条发布记录，再填写 1~3 个汇总范围（每个范围选若干分区与年龄组，交集至少含一个调查格）。
      每条算式只对所选记录的总数做加减，同一记录至多出现一次；按人数表核对覆盖：范围内每格净计 1 次、范围外每格净计 0 次。
      整份报告用到的不同发布编号取最少。全部范围都可拼出时才会生成可重新打开的引用页。
    </p>
    <h3>1) 勾选发布记录（1~20 条）</h3>
    <div id="pubPick" class="pubpick hint">加载中…</div>
    <div class="hint" id="pubCount"></div>
    <h3>2) 填写汇总范围（1~3 个）</h3>
    <div id="ranges"></div>
    <div>
      <button class="secondary" id="addRange" onclick="addRange()">+ 增加范围</button>
      <button onclick="doCite()">生成引用页</button>
    </div>
    <div id="citeMsg" class="msg"></div>
  </section>
</main>
<script>
let data = null;
let rangeCount = 0;

function esc(s){return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function api(path, opts){
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if(!r.ok) throw {status: r.status, body};
  return body;
}

function checkboxGroup(name, values, cls){
  return values.map(v =>
    `<label><input type="checkbox" class="${cls}" data-group="${name}" value="${esc(v)}"> ${esc(v)}</label>`
  ).join('');
}

async function load(){
  data = await api('/api/public');
  if(!data.imported){
    document.getElementById('grid').innerHTML = '<p class="hint">尚未发布数据</p>';
    document.getElementById('pubs').innerHTML = '';
    document.getElementById('pubPick').innerHTML = '<span class="hint">暂无可引用记录</span>';
    document.getElementById('citeSec').classList.add('hidden');
    return;
  }
  const ds = [...new Set(data.cells.map(c => c.district))].sort();
  const as = [...new Set(data.cells.map(c => c.age_group))].sort();
  const pop = {};
  for(const c of data.cells) pop[c.district + '|' + c.age_group] = c.population;
  let h = '<table><tr><th>分区</th>' + as.map(a => `<th>${esc(a)}</th>`).join('') + '</tr>';
  for(const d of ds)
    h += '<tr><td>' + esc(d) + '</td>' + as.map(a => `<td>${pop[d + '|' + a] ?? '—'}</td>`).join('') + '</tr>';
  document.getElementById('grid').innerHTML = h + '</table>';

  document.getElementById('pubs').innerHTML = data.publications.length
    ? '<table><tr><th>#</th><th>分区</th><th>年龄组</th><th>检出总数</th><th>发布时间 (UTC)</th></tr>'
      + data.publications.map(p => `<tr><td>${p.id}</td><td>${esc(p.districts.join('、'))}</td><td>${esc(p.age_groups.join('、'))}</td><td>${p.total}</td><td>${esc(p.created_at)}</td></tr>`).join('')
      + '</table>'
    : '<p class="hint">暂无公开汇总</p>';

  document.getElementById('pubPick').innerHTML = data.publications.length
    ? data.publications.map(p =>
        `<label><input type="checkbox" class="pubchk" value="${p.id}"> #${p.id}`
        + `（${esc(p.districts.join('、'))} / ${esc(p.age_groups.join('、'))} = ${p.total}）</label>`
      ).join('')
    : '<span class="hint">暂无公开汇总，无法生成引用页</span>';

  if(document.querySelectorAll('#ranges .range').length === 0) addRange();
  updatePubCount();
}

function updatePubCount(){
  const n = document.querySelectorAll('.pubchk:checked').length;
  const el = document.getElementById('pubCount');
  if(el) el.textContent = n ? `已勾选 ${n} 条发布记录` : '尚未勾选发布记录';
}

function dimensions(){
  if(!data || !data.imported) return [[], []];
  return [
    [...new Set(data.cells.map(c => c.district))].sort(),
    [...new Set(data.cells.map(c => c.age_group))].sort(),
  ];
}

function addRange(){
  if(document.querySelectorAll('#ranges .range').length >= 3) return;
  rangeCount += 1;
  const [ds, as] = dimensions();
  const div = document.createElement('div');
  div.className = 'range';
  div.dataset.n = String(rangeCount);
  div.innerHTML =
    `<b>范围 <span class="rangeNo">${document.querySelectorAll('#ranges .range').length + 1}</span></b>`
    + ` <button class="link" onclick="removeRange('${rangeCount}')">删除</button>`
    + `<div class="checks"><b>分区：</b>${checkboxGroup('d', ds, 'dchk')}</div>`
    + `<div class="checks"><b>年龄组：</b>${checkboxGroup('a', as, 'achk')}</div>`;
  document.getElementById('ranges').appendChild(div);
}
function removeRange(n){
  const box = [...document.querySelectorAll('#ranges .range')].find(b => b.dataset.n === n);
  if(box) box.remove();
  renumberRanges();
}
function renumberRanges(){
  [...document.querySelectorAll('#ranges .range')].forEach((box, i) => {
    const label = box.querySelector('.rangeNo');
    if(label) label.textContent = String(i + 1);
  });
}

function selectedValues(box, cls){
  return [...box.querySelectorAll('.' + cls + ':checked')].map(e => e.value);
}

function showErr(e){
  const el = document.getElementById('citeMsg');
  let text = '操作失败';
  const d = e.body && e.body.detail;
  if(typeof d === 'string'){
    text = d;
  }else if(d){
    text = d.message || '请求被拒绝';
    for(const r of (d.ranges || [])){
      text += `\n\n· 范围 ${r.position}（${r.label}）拼不出：`;
      text += (r.reasons || []).join('；');
      const cov = r.coverage || [];
      if(cov.length){
        text += '\n  目标格覆盖：' + cov.map(c =>
          `${c.district}/${c.age_group} ← ${c.publication_ids.length ? '#' + c.publication_ids.join('、#') : '无'}`).join('；');
      }
    }
  }
  el.className = 'msg err';
  el.textContent = text;
}

async function doCite(){
  const el = document.getElementById('citeMsg');
  const ids = [...document.querySelectorAll('.pubchk:checked')].map(e => Number(e.value));
  const ranges = [...document.querySelectorAll('#ranges .range')].map(box => ({
    districts: selectedValues(box, 'dchk'),
    age_groups: selectedValues(box, 'achk'),
  }));
  if(ids.length < 1 || ids.length > 20){
    el.className = 'msg err';
    el.textContent = '请勾选 1~20 条发布记录。';
    return;
  }
  if(ranges.length < 1 || ranges.length > 3){
    el.className = 'msg err';
    el.textContent = '请填写 1~3 个汇总范围。';
    return;
  }
  try{
    const r = await api('/api/citation', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({publication_ids: ids, ranges}),
    });
    el.className = 'msg ok';
    el.textContent = `已生成引用页（用到 ${r.publication_count} 个不同发布编号，`
      + `共 ${r.term_count} 个加减项）。\n可重新打开：${location.origin}${r.url}`;
    const a = document.createElement('a');
    a.href = r.url; a.target = '_blank'; a.textContent = '打开引用页 →';
    el.appendChild(document.createElement('br'));
    el.appendChild(a);
  }catch(e){ showErr(e); }
}

load();
document.addEventListener('change', e => {
  if(e.target && e.target.classList && e.target.classList.contains('pubchk')) updatePubCount();
});
</script>
</body>
</html>
